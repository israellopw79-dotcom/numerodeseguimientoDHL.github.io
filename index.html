<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cuenta regresiva Headless 🎃</title>
<style>
  body {
    margin: 0;
    background: linear-gradient(#0f172a, #1e293b);
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .container {
    text-align: center;
    background: rgba(0,0,0,0.5);
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 0 30px rgba(0,0,0,0.6);
  }

  h1 {
    font-size: 2rem;
    margin-bottom: 20px;
  }

  .time {
    font-size: 2.5rem;
    font-weight: bold;
    letter-spacing: 2px;
  }
</style>
</head>
<body>

<div class="container">
  <h1>🎃 Cuenta regresiva para Headless 🎃</h1>
  <div class="time" id="countdown"></div>
</div>

<script>
  const targetDate = new Date("October 1, 2026 00:00:00").getTime();

  function updateCountdown() {
    const now = new Date().getTime();
    const difference = targetDate - now;

    const days = Math.floor(difference / (1000 * 60 * 60 * 24));
    const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((difference / (1000 * 60)) % 60);
    const seconds = Math.floor((difference / 1000) % 60);

    document.getElementById("countdown").innerHTML =
      `${days}d ${hours}h ${minutes}m ${seconds}s`;
  }

  setInterval(updateCountdown, 1000);
</script>

</body>
</html>
